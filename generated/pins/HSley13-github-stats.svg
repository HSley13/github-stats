<svg id="gh-dark-mode-only" width="400" height="130" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 14px;
  line-height: 21px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: white;
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

#gh-dark-mode-only:target #background {
  fill: #0d1117;
  stroke-width: 0.5px;
}

foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

.title {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
  color: rgb(3, 102, 214);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#gh-dark-mode-only:target .title {
  color: #58a6ff;
}

.description {
  height: 36px;
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 18px;
  color: rgb(88, 96, 105);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

#gh-dark-mode-only:target .description {
  color: #8b949e;
}

.meta {
  display: flex;
  align-items: center;
  font-size: 12px;
  color: rgb(88, 96, 105);
}

#gh-dark-mode-only:target .meta {
  color: #8b949e;
}

.meta span {
  display: inline-flex;
  align-items: center;
  margin-right: 2ch;
}

.dot {
  width: 12px;
  height: 12px;
  margin-right: 0.5ch;
  border-radius: 50%;
}

.octicon {
  fill: rgb(88, 96, 105);
  margin-right: 1ch;
}

#gh-dark-mode-only:target .octicon {
  fill: #8b949e;
}

.card {
  opacity: 0;
  animation: fadeIn 0.8s ease-in-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}
</style>
